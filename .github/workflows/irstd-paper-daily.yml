name: Update IRSTD Paper Daily

on:
  workflow_dispatch:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  GITHUB_USER_NAME: Sakauma
  GITHUB_USER_EMAIL: irstd-paper-daily@users.noreply.github.com

jobs:
  update:
    name: Fetch and publish daily papers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily arXiv update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python daily_arxiv.py --notify-wechat --notify-unchanged

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update IRSTD paper daily"
          file_pattern: README.md docs/irstd-paper-daily-state.json docs/irstd-paper-daily.json docs/irstd-paper-daily-wechat.json docs/index.md docs/wechat.md
          commit_user_name: ${{ env.GITHUB_USER_NAME }}
          commit_user_email: ${{ env.GITHUB_USER_EMAIL }}

      - name: Send email digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m arxiv_daily.emailer docs/wechat.md
