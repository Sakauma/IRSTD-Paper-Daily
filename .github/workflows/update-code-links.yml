name: Full Refresh IRSTD Papers and Code Links

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 08:00（北京时间 16:00）执行全量论文和代码链接刷新
    - cron: "0 8 * * 1"

permissions:
  contents: write

env:
  GITHUB_USER_NAME: Sakauma
  GITHUB_USER_EMAIL: irstd-paper-daily@users.noreply.github.com

jobs:
  full-refresh:
    name: Full refresh papers and code links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Full refresh papers and code links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python daily_arxiv.py --full-refresh --backfill_code --notify-wechat

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: fully refresh IRSTD papers and code links"
          file_pattern: README.md docs/irstd-paper-daily-state.json docs/irstd-paper-daily.json docs/irstd-paper-daily-wechat.json docs/index.md docs/wechat.md
          commit_user_name: ${{ env.GITHUB_USER_NAME }}
          commit_user_email: ${{ env.GITHUB_USER_EMAIL }}
