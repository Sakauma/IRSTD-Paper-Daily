# =====================================================================
# IRSTD-PAPER-DAILY 配置文件
# ---------------------------------------------------------------------
# domains 是领域配置。新增领域时复制一个条目并修改 enable、
# max_results 和 filters，代码无需改动。
# =====================================================================

# 仓库信息（用于 README 底部徽章）
user_name: "Sakauma"
repo_name: "IRSTD-Paper-Daily"

# 全局默认值
show_authors: true
show_links: true
show_badge: true
max_results: 10

# 通过 GitHub 搜索 API 为论文匹配代码仓库
enable_code_lookup: true

# 发布开关
publish_readme: true
publish_gitpage: true
publish_wechat: true

# 文件路径
data_path: "./docs/irstd-paper-daily.json"
wechat_data_path: "./docs/irstd-paper-daily-wechat.json"
md_readme_path: "README.md"
md_gitpage_path: "./docs/index.md"
md_wechat_path: "./docs/wechat.md"

# ===================== 领域配置 =====================
domains:
    "IRSTD":
        enable: true
        max_results: 10
        filters:
            - "Infrared Small Target Detection"
            - "Infrared Small Target"
            - "Infrared Dim Small Target"
            - "Dim Small Target Detection"
            - "Infrared Weak Small Target"
            - "Small Target Detection"
            - "IRSTD"
            - "Infrared Target Detection"

    # 新增领域示例：取消注释后即可启用，无需修改 Python 代码。
    # "New Domain":
    #     enable: true
    #     max_results: 10
    #     filters:
    #         - "keyword1"
    #         - "keyword phrase 2"
