# =====================================================================
# IRSTD-PAPER-DAILY 配置文件
# ---------------------------------------------------------------------
# domains 是领域配置。新增领域时复制一个条目并修改 enable、
# max_results 和 filters，代码无需改动。
# =====================================================================

# 仓库信息（用于 README 底部徽章）
user_name: "Sakauma"
repo_name: "IRSTD-Paper-Daily"

# 全局默认值；max_results: null 表示不限制数量。
show_authors: true
show_links: true
show_badge: true
max_results: null

# 只收录从该日期起首次提交到 arXiv 的论文，结束日期自动取运行当天。
start_date: "2025-01-01"

# 每日增量抓取会从上次成功日期向前回看，容忍 arXiv 收录延迟。
incremental_lookback_days: 3

# 通过 GitHub 搜索 API 为论文匹配代码仓库
enable_code_lookup: true

# 发布开关
publish_readme: true
publish_gitpage: true
publish_wechat: true

# 微信通知通过 WxPusher 发送。密钥和接收 UID 只从环境变量读取：
# WXPUSHER_APP_TOKEN、WXPUSHER_UIDS（多个 UID 用逗号分隔）。
wechat_notification:
    provider: "wxpusher"
    max_papers: 20

# 文件路径
data_path: "./docs/irstd-paper-daily.json"
state_path: "./docs/irstd-paper-daily-state.json"
wechat_data_path: "./docs/irstd-paper-daily-wechat.json"
md_readme_path: "README.md"
md_gitpage_path: "./docs/index.md"
md_wechat_path: "./docs/wechat.md"

# ===================== 领域配置 =====================
domains:
    "IRSTD":
        enable: true
        max_results: null
        filters:
            - "Infrared Small Target Detection"
            - "Infrared Small Target Segmentation"
            - "Infrared Small Target"
            - "Infrared Dim Small Target"
            - "Infrared Weak Small Target"
            - "Moving Infrared Small Target"
            - "IRSTD"
            - "SIRST"

    # 新增领域示例：取消注释后即可启用，无需修改 Python 代码。
    # "New Domain":
    #     enable: true
    #     max_results: null
    #     start_date: "2025-01-01"
    #     incremental_lookback_days: 3
    #     filters:
    #         - "keyword1"
    #         - "keyword phrase 2"
