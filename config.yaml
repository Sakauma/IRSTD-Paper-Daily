# =====================================================================
# IRSTD-PAPER-DAILY 配置文件
# ---------------------------------------------------------------------
# domains 是领域配置。新增领域时复制一个条目并修改 enable、
# max_results 以及 query 或 filters，代码无需改动。
# =====================================================================

# 仓库信息（用于 README 底部徽章）
user_name: "Sakauma"
repo_name: "IRSTD-Paper-Daily"

# 全局默认值；max_results: null 表示不限制数量。
show_authors: true
show_links: true
show_badge: true
max_results: null

# 只收录从该日期起首次提交到 arXiv 的论文，结束日期自动取运行当天。
start_date: "2025-01-01"

# 每日增量抓取会从上次成功日期向前回看，容忍 arXiv 收录延迟。
incremental_lookback_days: 3

# 通过 GitHub 搜索 API 为论文匹配代码仓库
enable_code_lookup: true

# 发布开关
publish_readme: true
publish_gitpage: true
publish_wechat: true

# 微信通知通过 Server酱发送，SendKey 只从 SERVERCHAN_SENDKEY 环境变量读取。
wechat_notification:
    provider: "serverchan"
    max_papers: 20

# 文件路径
data_path: "./docs/irstd-paper-daily.json"
state_path: "./docs/irstd-paper-daily-state.json"
wechat_data_path: "./docs/irstd-paper-daily-wechat.json"
md_readme_path: "README.md"
md_gitpage_path: "./docs/index.md"
md_wechat_path: "./docs/wechat.md"

# ===================== 领域配置 =====================
domains:
    "IRSTD":
        enable: true
        max_results: null
        # 宽范围候选查询：要求红外语境与小/弱/暗/微小/点目标表达同时出现，
        # 或命中该领域常用缩写与数据集名称。任务类型不受限制。
        query: >-
            ((all:infrared OR all:"infra-red") AND
            (all:"small target" OR all:"small targets" OR
            all:"small-target" OR all:"small-targets" OR
            all:"dim target" OR all:"dim targets" OR
            all:"dim-target" OR all:"dim-targets" OR
            all:"weak target" OR all:"weak targets" OR
            all:"weak-target" OR all:"weak-targets" OR
            all:"tiny target" OR all:"tiny targets" OR
            all:"tiny-target" OR all:"tiny-targets" OR
            all:"point target" OR all:"point targets" OR
            all:"point-target" OR all:"point-targets" OR
            all:"small object" OR all:"small objects" OR
            all:"small-object" OR all:"small-objects")) OR
            all:IRSTD OR all:SIRST OR all:MIRST OR all:MIRSTD OR
            all:MFIRST OR all:"NUAA-SIRST" OR all:"NUDT-SIRST" OR
            all:"IRSTD-1K" OR all:IRSTD1K

    # 新增领域示例：取消注释后即可启用，无需修改 Python 代码。
    # "New Domain":
    #     enable: true
    #     max_results: null
    #     start_date: "2025-01-01"
    #     incremental_lookback_days: 3
    #     filters:
    #         - "keyword1"
    #         - "keyword phrase 2"
